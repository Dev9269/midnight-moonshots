name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh \
            | sh
          compact --version

      - name: Compile the Compact contract
        run: |
          export PATH="$HOME/.compact/bin:$PATH"
          npm run compile

      - name: Syntax-check source
        run: |
          export PATH="$HOME/.compact/bin:$PATH"
          npm run check

      - name: Run tests
        run: npm test

      - name: Build UI
        run: npm run build