# Local ZK proof server for Midnight (Midnight DevNet / proof generation).
#
#   docker compose up -d
#   curl http://localhost:6300/ping   # expect pong
#
# Must run before compiling/deploying a contract. Version must stay in lockstep
# with the @midnight-ntwrk SDK packages used in your DApp (see README).

services:
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    command: ["midnight-proof-server", "-v"]
    ports:
      - "6300:6300"
    restart: on-failure
    volumes:
      - proof-server-params:/root

volumes:
  proof-server-params: